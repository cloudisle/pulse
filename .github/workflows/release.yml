name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example: 1.40.0 or v1.40.0)"
        required: true
        type: string
      target_sha:
        description: Commit SHA to release from (defaults to current workflow SHA)
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: "Version to release (for example: 1.40.0 or v1.40.0)"
        required: true
        type: string
      target_sha:
        description: Commit SHA to release from (defaults to caller SHA)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_sha != '' && inputs.target_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: xvfb-run --auto-servernum npm test

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-release
          path: |
            test-results/playwright
            test-results/.last-run.json
          retention-days: 30
          if-no-files-found: ignore

  package-linux:
    name: Package Linux
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_sha != '' && inputs.target_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package (Linux)
        run: npx electron-builder --linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 1

  package-mac:
    name: Package macOS
    needs: build-and-test
    runs-on: macos-latest
    # NOTE: macOS code signing and notarization are out of scope for this workflow.
    # To enable them, set the CSC_LINK and CSC_KEY_PASSWORD secrets and configure
    # the notarization credentials (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID).

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_sha != '' && inputs.target_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package (macOS)
        run: npx electron-builder --mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: dist/*.dmg
          retention-days: 1

  package-windows:
    name: Package Windows
    needs: build-and-test
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_sha != '' && inputs.target_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package (Windows)
        run: npx electron-builder --win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*.exe
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [package-linux, package-mac, package-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts/linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-artifacts
          path: artifacts/mac

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/windows

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version) }}
          TARGET_SHA: ${{ inputs.target_sha != '' && inputs.target_sha || github.sha }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --target "${TARGET_SHA}" \
            --title "Release ${RELEASE_TAG}" \
            --generate-notes \
            artifacts/linux/* \
            artifacts/mac/* \
            artifacts/windows/*
